name: Check the formula against the tap
description: >
  Fetches Formula/zigbox.rb from ZigboxOrg/homebrew-tap main and compares it with the generated
  formula. Refuses unless the difference is only the url, version and sha256 lines (plus the
  lines check-diff.sh lists, which the move to a universal binary and the move to ZigboxOrg and
  Apache-2.0 change once). Writes nothing to the
  tap. The caller sets GH_TOKEN to a token that can read the tap and runs the pinned gh.
inputs:
  formula:
    description: Path of the generated formula.
    required: true
  url:
    description: The one url the formula may name, the release's own zip download.
    required: true
outputs:
  changed:
    description: '"true" when the formula differs from the tap''s, else "false".'
    value: ${{ steps.check.outputs.changed }}
  blob:
    description: The blob SHA of the tap's current Formula/zigbox.rb (for the update call).
    value: ${{ steps.check.outputs.blob }}
runs:
  using: composite
  steps:
    - name: Compare
      id: check
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        FORMULA: ${{ inputs.formula }}
        WANT_URL: ${{ inputs.url }}
        TAP: ZigboxOrg/homebrew-tap
      run: |
        # Before anything is fetched: the formula names exactly one url, and it is the release's zip.
        # The line rule (check-diff.sh) allows any url line, so this is the check on the value.
        "$GITHUB_ACTION_PATH/check-url.sh" "$FORMULA" "$WANT_URL"
        current="${RUNNER_TEMP}/tap-current.rb"
        info=$(gh api "repos/$TAP/contents/Formula/zigbox.rb?ref=main" --jq '.sha')
        gh api -H 'Accept: application/vnd.github.raw' "repos/$TAP/contents/Formula/zigbox.rb?ref=main" > "$current"
        echo "blob=$info" >> "$GITHUB_OUTPUT"
        if cmp -s "$current" "$FORMULA"; then
          echo "tap: Formula/zigbox.rb is already this formula"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The rule on which lines may differ, tested against the tap's real formula by
        # .github/tap-formula-test.sh.
        "$GITHUB_ACTION_PATH/check-diff.sh" "$current" "$FORMULA"
        echo "tap: the formula differs from the tap's only in allowed lines"
        echo "changed=true" >> "$GITHUB_OUTPUT"
