# VM runs on demand, as .github/workflows/vm.yml: a push to vm/<demo>-<anything> runs that demo in a
# KVM guest on the fleet box (ops/ci/README.md), then deletes the scratch branch through the GitHub
# API (the github_token secret; without it the branch stays and the run still passes). <demo> is
# any name vm.yml takes, or all (src/ci/demos.zig). vm/top20-* is not run here. A newer push to
# the same branch cancels the older run when the repository's "Cancel previous pipelines" setting
# is on. The step is `zig build vm-branch`; the rest is CI-only.
when:
  - event: push
    branch:
      include: vm/**
      exclude: vm/top20-**

clone:
  - name: clone
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      partial: false

steps:
  - name: demo
    image: zigbox-ci:0.17.0
    privileged: true
    volumes:
      - /var/lib/zigbox-ci:/cache
    environment:
      # As check.yaml: the work runs as tester; the root build keeps its own caches.
      ZBX_CI_USER: tester
      ZBX_CI_USER_ZIG_CACHE: /cache/zig
      ZIG_GLOBAL_CACHE_DIR: /cache/zig-root
      ZIG_LOCAL_CACHE_DIR: /cache/zig-root/local
      ZBX_VM_CACHE: /cache/vm-entries
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - zig build vm-branch -- "$CI_COMMIT_BRANCH"
